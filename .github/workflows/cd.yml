name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build go
        run: |
          chmod +x ./scripts/buildprod.sh
          ./scripts/buildprod.sh
      
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 'Use gcloud CLI'
        run: 'gcloud info'
      
      - name: Build and push Docker image
        run: gcloud builds submit --tag europe-west3-docker.pkg.dev/notely-490213/notely-ar-repo/notely:Tag .
      
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image europe-west3-docker.pkg.dev/notely-490213/notely-ar-repo/notely:Tag --region us-central1 --allow-unauthenticated --project notely-490213 --max-instances=4
